<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Tech Admin (Prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:Manrope,system-ui,sans-serif;background:#f6f4ee;color:#151515;overflow-x:hidden}
:focus-visible{outline:3px solid #c98a00;outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;padding:.5rem 1rem;border-radius:.7rem;font-weight:700;transition:.2s}
.bp{background:#F7B52C;color:#111}.bp:hover{background:#e6a312}
.bs{background:#fff;border:1px solid #d9d3c3}.bs:hover{border-color:#F7B52C}
.bx{background:#fff;border:1px solid #e3a5a5;color:#a11}.bx:hover{background:#fdeeee}
.card{background:#fff;border:1px solid #ebe5d6;border-radius:1rem}
.in{width:100%;min-height:44px;padding:.5rem .75rem;border:1px solid #b9b19c;border-radius:.65rem;background:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div id="root"></div>
<script>
const {useState,useEffect,useMemo}=React;const html=htm.bind(React.createElement);const P=n=>'₱'+Number(n).toLocaleString('en-PH');
const IC={plus:'M12 5v14M5 12h14',trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',edit:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',box:'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',home:'M3 11 12 3l9 8M5 10v10h14V10',inbox:'M4 4h16v16H4zM4 14h5l1 2h4l1-2h5',gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12l2-1-2-4-2 1-2-1-1-2H9L8 7 6 8 4 7l-2 4 2 1v2l-2 1 2 4 2-1 2 1 1 2h4l1-2 2-1 2 1 2-4-2-1z',out:'M9 4H4v16h5M16 8l4 4-4 4M20 12H9',x:'M18 6 6 18M6 6l12 12',search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4-4',img:'M3 5h18v14H3zM8 10m-1.5 0a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0M21 16l-5-5-9 8',alert:'M12 9v4M12 17h.01M10.3 3.9 2 18h20L13.7 3.9a2 2 0 0 0-3.4 0z',check:'m5 12 5 5 9-10'};
const I=({n,s=20})=>html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d=${IC[n]}/></svg>`;
/* ---- seed data: in the real site this comes from the database ---- */
const CATS=['Processors','Motherboards','RAM','SSD & HDD','Graphics Cards','Power Supplies','PC Cases','Cooling','Peripherals'];
const SEED={products:[
{id:1,name:'Ryzen 5 5600 (6-core)',cat:'Processors',price:7490,stock:12,visible:true,desc:'AM4 6-core desktop processor.',img:''},
{id:2,name:'16GB DDR4 3200 Kit (2×8GB)',cat:'RAM',price:2090,stock:25,visible:true,desc:'Dual-channel desktop memory kit.',img:''},
{id:3,name:'500GB NVMe SSD',cat:'SSD & HDD',price:2190,stock:3,visible:true,desc:'M.2 2280 PCIe 3.0 SSD.',img:''},
{id:4,name:'RTX 4060 8GB',cat:'Graphics Cards',price:18900,stock:4,visible:true,desc:'8GB GDDR6 graphics card.',img:''},
{id:5,name:'650W 80+ Bronze PSU',cat:'Power Supplies',price:2890,stock:0,visible:true,desc:'ATX power supply.',img:''},
{id:6,name:'Wireless Mouse',cat:'Peripherals',price:690,stock:22,visible:false,desc:'2.4 GHz wireless mouse. (Hidden draft)',img:''}],
orders:[{id:'ORD-7K2QX1',who:'Maria Santos',what:'500GB NVMe SSD ×1',total:2190,status:'New',note:'Pickup'},{id:'ORD-M3P9ZD',who:'Juan Dela Cruz',what:'RTX 4060 ×1, 650W PSU ×1',total:21790,status:'Processing',note:'Delivery'}],
bookings:[{id:'BK-4TR8LA',who:'Ana Reyes',what:'GPU cleaning & thermal paste · Drop-off',total:0,status:'Pending',note:'Requested Oct 20, 1:00 PM'},{id:'BK-91WQ2E',who:'Paolo Garcia',what:'Windows reinstallation · Remote',total:0,status:'Confirmed',note:'Requested Oct 18, 9:00 AM'}],
quotes:[{id:'QR-XK55B0',who:'Lito Ramos',what:'Embedded: ESP32 water tank monitor',total:0,status:'Pending',note:'Budget ₱10,000–₱30,000'}],
settings:{phone:'+63 963 310 2486',email:'twotech0128@gmail.com',address:'Purok 4, Brgy. Sta. Maria, Filinvest Rd, Santo Tomas',hours:'9:00 AM–8:00 PM',facebook:'https://www.facebook.com/Engr.TwoTECH',headline:'Your Partner in IT Solutions, Repairs & Custom Development.',banner:''}};
const STAT={orders:['New','Processing','Ready','Completed','Cancelled'],bookings:['Pending','Confirmed','Done','Cancelled'],quotes:['Pending','Reviewing','Quoted','Closed']};
const load=()=>{try{return JSON.parse(localStorage.getItem('tt-admin'))||SEED}catch(e){return SEED}};
const Modal=({title,onClose,children})=>{useEffect(()=>{const k=e=>e.key==='Escape'&&onClose();document.addEventListener('keydown',k);return()=>document.removeEventListener('keydown',k)},[]);
return html`<div className="fixed inset-0 z-50 bg-black/70 flex items-end sm:items-center justify-center sm:p-4" onClick=${onClose}><div role="dialog" aria-modal="true" aria-label=${title} onClick=${e=>e.stopPropagation()} className="bg-white w-full sm:max-w-2xl max-h-[92vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl"><div className="sticky top-0 bg-white flex justify-between items-center px-5 py-3 border-b"><h2 className="font-extrabold text-lg">${title}</h2><button className="p-2 rounded-lg hover:bg-stone-100" aria-label="Close" onClick=${onClose}><${I} n="x"/></button></div><div className="p-5">${children}</div></div></div>`};
const F=({l,err,children,help})=>html`<label className="block text-sm font-semibold">${l}${children}${help&&html`<span className="block text-xs font-normal text-stone-600 mt-1">${help}</span>`}${err&&html`<span role="alert" className="block text-sm text-red-700 mt-1">${err}</span>`}</label>`;
const Badge=({s})=>{const c={New:'bg-amber-100 text-amber-900',Pending:'bg-amber-100 text-amber-900',Processing:'bg-sky-100 text-sky-900',Reviewing:'bg-sky-100 text-sky-900',Confirmed:'bg-sky-100 text-sky-900',Ready:'bg-emerald-100 text-emerald-900',Quoted:'bg-emerald-100 text-emerald-900',Completed:'bg-emerald-100 text-emerald-900',Done:'bg-emerald-100 text-emerald-900',Cancelled:'bg-stone-200 text-stone-700',Closed:'bg-stone-200 text-stone-700'}[s]||'bg-stone-200';return html`<span className=${'text-xs font-bold px-2 py-1 rounded-full '+c}>${s}</span>`};
/* ---- Login ---- */
const Login=({on})=>html`<div className="min-h-screen grid place-items-center p-4 bg-[#111]"><form onSubmit=${e=>{e.preventDefault();on()}} className="card p-6 w-full max-w-sm"><p className="font-extrabold text-2xl">Two<span className="text-[#c98a00]">Tech</span> Admin</p><p className="text-sm text-stone-600 mt-1">Owner sign-in</p><div className="mt-4 grid gap-3"><${F} l="Email"><input className="in mt-1" type="email" defaultValue="twotech0128@gmail.com" autoComplete="username"/><//><${F} l="Password"><input className="in mt-1" type="password" defaultValue="demo-password" autoComplete="current-password"/><//><button className="btn bp" type="submit">Sign in</button></div><p className="text-xs bg-amber-50 border border-amber-300 text-amber-900 rounded-lg p-2 mt-4">Prototype only: any input signs you in. A real version uses secure login (e.g. Supabase Auth).</p></form></div>`;
/* ---- Dashboard ---- */
const Dash=({d,go})=>{const low=d.products.filter(p=>p.stock<=5);const St=(l,v,t,tone)=>html`<button key=${l} onClick=${()=>go(t)} className="card p-4 text-left hover:border-[#F7B52C] transition"><span className="text-sm text-stone-600">${l}</span><b className=${'block text-3xl mt-1 '+(tone||'')}>${v}</b></button>`;
return html`<div><h1 className="text-2xl font-extrabold">Dashboard</h1><div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-4">${St('Products listed',d.products.filter(p=>p.visible).length,'Products')}${St('Low or out of stock',low.length,'Products',low.length?'text-red-700':'')}${St('Orders to handle',d.orders.filter(o=>['New','Processing'].includes(o.status)).length,'Inbox')}${St('Bookings & quotes pending',[...d.bookings,...d.quotes].filter(o=>o.status==='Pending').length,'Inbox')}</div>
<div className="card p-4 mt-5"><h2 className="font-extrabold flex gap-2 items-center"><${I} n="alert" s=${18}/>Needs restocking</h2>${low.length?html`<ul className="mt-2 divide-y">${low.map(p=>html`<li key=${p.id} className="py-2 flex justify-between gap-2"><span>${p.name}</span><b className=${p.stock?'text-amber-700':'text-red-700'}>${p.stock?p.stock+' left':'Out of stock'}</b></li>`)}</ul>`:html`<p className="text-stone-600 mt-2">Everything is well stocked.</p>`}</div></div>`};
/* ---- Products ---- */
const PForm=({p,onSave,onClose})=>{const [f,setF]=useState(p||{name:'',cat:CATS[0],price:'',stock:'',desc:'',img:'',visible:true});const [e,setE]=useState({});const set=k=>ev=>setF({...f,[k]:ev.target.value});
const pick=ev=>{const file=ev.target.files[0];if(!file)return;if(file.size>1.5e6){setE({...e,img:'Image is over 1.5 MB. Choose a smaller file.'});return}const r=new FileReader();r.onload=()=>{setF({...f,img:r.result});setE({...e,img:''})};r.readAsDataURL(file)};
const sub=ev=>{ev.preventDefault();const x={};if(!f.name.trim())x.name='Enter a product name.';if(f.price===''||+f.price<=0)x.price='Enter a price above 0.';if(f.stock===''||+f.stock<0||!Number.isInteger(+f.stock))x.stock='Enter a whole number, 0 or more.';setE(x);if(!Object.keys(x).length)onSave({...f,price:+f.price,stock:+f.stock})};
return html`<form onSubmit=${sub} noValidate className="grid sm:grid-cols-2 gap-4"><div className="sm:col-span-2"><${F} l="Product name" err=${e.name}><input className="in mt-1" value=${f.name} onInput=${set('name')}/><//></div><${F} l="Category"><select className="in mt-1" value=${f.cat} onChange=${set('cat')}>${CATS.map(c=>html`<option key=${c}>${c}</option>`)}</select><//><${F} l="Price (₱)" err=${e.price}><input className="in mt-1" type="number" min="0" inputMode="decimal" value=${f.price} onInput=${set('price')}/><//><${F} l="Stock quantity" err=${e.stock}><input className="in mt-1" type="number" min="0" value=${f.stock} onInput=${set('stock')}/><//><label className="flex items-center gap-3 min-h-[44px] mt-6 font-semibold"><input type="checkbox" className="w-5 h-5" checked=${f.visible} onChange=${()=>setF({...f,visible:!f.visible})}/>Show in shop</label><div className="sm:col-span-2"><${F} l="Description and specs"><textarea className="in mt-1" rows="3" value=${f.desc} onInput=${set('desc')}/><//></div><div className="sm:col-span-2"><${F} l="Product photo" err=${e.img} help="JPG or PNG, under 1.5 MB."><input className="in mt-1" type="file" accept="image/*" onChange=${pick}/><//>${f.img?html`<div className="mt-2 flex items-center gap-3"><img src=${f.img} alt="Preview" className="w-24 h-20 object-cover rounded-lg border"/><button type="button" className="btn bx" onClick=${()=>setF({...f,img:''})}>Remove photo</button></div>`:null}</div><div className="sm:col-span-2 flex gap-2 justify-end"><button type="button" className="btn bs" onClick=${onClose}>Cancel</button><button type="submit" className="btn bp">${p?'Save changes':'Add product'}</button></div></form>`};
const Products=({d,upd,toast})=>{const [q,setQ]=useState('');const [m,setM]=useState(null);const [del,setDel]=useState(null);
const list=d.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())||p.cat.toLowerCase().includes(q.toLowerCase()));
const save=p=>{if(p.id)upd({products:d.products.map(x=>x.id===p.id?p:x)});else upd({products:[{...p,id:Date.now()},...d.products]});setM(null);toast(p.id?'Changes saved':'Product added to the shop')};
return html`<div><div className="flex flex-wrap gap-3 justify-between items-center"><h1 className="text-2xl font-extrabold">Products</h1><button className="btn bp" onClick=${()=>setM({})}><${I} n="plus" s=${18}/>Add product</button></div><div className="relative mt-4 max-w-md"><input className="in pl-9" type="search" aria-label="Search products" placeholder="Search by name or category" value=${q} onInput=${e=>setQ(e.target.value)}/><span className="absolute left-3 top-3 text-stone-500"><${I} n="search" s=${18}/></span></div>
${list.length?html`<ul className="mt-4 grid gap-3">${list.map(p=>html`<li key=${p.id} className="card p-3 flex flex-wrap items-center gap-3"><div className="w-16 h-14 rounded-lg bg-stone-100 grid place-items-center overflow-hidden text-stone-400 shrink-0">${p.img?html`<img src=${p.img} alt="" className="w-full h-full object-cover"/>`:html`<${I} n="img"/>`}</div><div className="flex-1 min-w-[180px]"><b>${p.name}</b><p className="text-sm text-stone-600">${p.cat} · ${P(p.price)}</p></div><div className="flex items-center gap-2 text-sm">${p.stock===0?html`<span className="font-bold text-red-700">Out of stock</span>`:html`<span className=${'font-bold '+(p.stock<=5?'text-amber-700':'text-emerald-700')}>${p.stock} in stock</span>`}${!p.visible&&html`<span className="px-2 py-1 rounded-full bg-stone-200 text-xs font-bold">Hidden</span>`}</div><div className="flex gap-2"><button className="btn bs" onClick=${()=>setM(p)} aria-label=${'Edit '+p.name}><${I} n="edit" s=${16}/>Edit</button><button className="btn bx" onClick=${()=>setDel(p)} aria-label=${'Delete '+p.name}><${I} n="trash" s=${16}/></button></div></li>`)}</ul>`:html`<div className="card p-10 text-center mt-4"><b>No products found</b><p className="text-stone-600">Try another search, or add a new product.</p></div>`}
${m&&html`<${Modal} title=${m.id?'Edit product':'Add product'} onClose=${()=>setM(null)}><${PForm} p=${m.id?m:null} onSave=${save} onClose=${()=>setM(null)}/><//>`}
${del&&html`<${Modal} title="Delete this product?" onClose=${()=>setDel(null)}><p><b>${del.name}</b> will be removed from the shop. To keep it but stop selling it, use "Show in shop" instead.</p><div className="flex gap-2 justify-end mt-5"><button className="btn bs" onClick=${()=>setDel(null)}>Keep product</button><button className="btn bx" onClick=${()=>{upd({products:d.products.filter(x=>x.id!==del.id)});setDel(null);toast('Product deleted')}}>Delete</button></div><//>`}</div>`};
/* ---- Inbox ---- */
const Inbox=({d,upd,toast})=>{const [t,setT]=useState('orders');const rows=d[t];const labels={orders:'Orders',bookings:'Bookings',quotes:'Quote requests'};
return html`<div><h1 className="text-2xl font-extrabold">Inbox</h1><div role="tablist" className="flex gap-2 mt-4 flex-wrap">${Object.keys(labels).map(k=>html`<button key=${k} role="tab" aria-selected=${t===k} onClick=${()=>setT(k)} className=${'btn '+(t===k?'bp':'bs')}>${labels[k]} (${d[k].length})</button>`)}</div>
${rows.length?html`<ul className="mt-4 grid gap-3">${rows.map(r=>html`<li key=${r.id} className="card p-4 flex flex-wrap gap-3 items-center justify-between"><div className="min-w-[200px] flex-1"><p className="font-bold">${r.who} <span className="font-normal text-sm text-stone-600">· ${r.id}</span></p><p className="text-sm">${r.what}</p><p className="text-sm text-stone-600">${r.note}${r.total?' · '+P(r.total):''}</p></div><${Badge} s=${r.status}/><label className="text-sm font-semibold"><span className="sr-only">Update status</span><select className="in !w-auto" value=${r.status} onChange=${e=>{upd({[t]:rows.map(x=>x.id===r.id?{...x,status:e.target.value}:x)});toast('Status updated to '+e.target.value)}}>${STAT[t].map(s=>html`<option key=${s}>${s}</option>`)}</select></label></li>`)}</ul>`:html`<div className="card p-10 text-center mt-4"><b>Nothing here yet</b></div>`}
<p className="text-xs text-stone-600 mt-4">Sample entries. In the real site, submissions from the shop and forms would appear here automatically.</p></div>`};
/* ---- Settings ---- */
const Settings=({d,upd,toast})=>{const [f,setF]=useState(d.settings);const set=k=>e=>setF({...f,[k]:e.target.value});
return html`<div><h1 className="text-2xl font-extrabold">Website settings</h1><p className="text-stone-600 mt-1">Edit the details shown on the public website.</p><div className="grid lg:grid-cols-2 gap-5 mt-4"><form onSubmit=${e=>{e.preventDefault();upd({settings:f});toast('Website details saved')}} className="card p-5 grid gap-3"><${F} l="Home page headline"><textarea className="in mt-1" rows="2" value=${f.headline} onInput=${set('headline')}/><//><${F} l="Announcement banner (optional)" help="Shown at the top of every page, e.g. holiday hours."><input className="in mt-1" value=${f.banner} onInput=${set('banner')}/><//><${F} l="Phone"><input className="in mt-1" value=${f.phone} onInput=${set('phone')}/><//><${F} l="Email"><input className="in mt-1" type="email" value=${f.email} onInput=${set('email')}/><//><${F} l="Address"><input className="in mt-1" value=${f.address} onInput=${set('address')}/><//><${F} l="Business hours"><input className="in mt-1" value=${f.hours} onInput=${set('hours')}/><//><${F} l="Facebook page link"><input className="in mt-1" type="url" value=${f.facebook} onInput=${set('facebook')}/><//><button className="btn bp" type="submit">Save changes</button></form>
<div><p className="font-bold mb-2">Live preview</p><div className="rounded-2xl bg-[#111] text-stone-300 p-5 text-sm grid gap-2">${f.banner&&html`<p className="bg-[#F7B52C] text-black font-bold rounded-lg px-3 py-2">${f.banner}</p>`}<p className="text-white text-xl font-extrabold leading-tight">${f.headline}</p><hr className="border-white/20 my-2"/><p>Phone: ${f.phone}</p><p>Email: ${f.email}</p><p>${f.address}</p><p>Hours: ${f.hours}</p></div></div></div></div>`};
/* ---- App shell ---- */
const App=()=>{const [auth,setAuth]=useState(false);const [d,setD]=useState(load);const [pg,setPg]=useState('Dashboard');const [msg,setMsg]=useState('');
useEffect(()=>{try{localStorage.setItem('tt-admin',JSON.stringify(d))}catch(e){}},[d]);
const upd=x=>setD(o=>({...o,...x}));const toast=t=>{setMsg(t);setTimeout(()=>setMsg(''),2200)};
if(!auth)return html`<${Login} on=${()=>setAuth(true)}/>`;
const nav=[['Dashboard','home'],['Products','box'],['Inbox','inbox'],['Settings','gear']];
const body=pg==='Dashboard'?html`<${Dash} d=${d} go=${setPg}/>`:pg==='Products'?html`<${Products} d=${d} upd=${upd} toast=${toast}/>`:pg==='Inbox'?html`<${Inbox} d=${d} upd=${upd} toast=${toast}/>`:html`<${Settings} d=${d} upd=${upd} toast=${toast}/>`;
return html`<div className="min-h-screen lg:flex"><aside className="bg-[#111] text-white lg:w-60 lg:min-h-screen lg:sticky lg:top-0 lg:h-screen shrink-0"><div className="flex lg:block items-center justify-between px-4 py-3"><p className="font-extrabold text-lg">Two<span className="text-[#F7B52C]">Tech</span> <span className="text-stone-400 text-sm font-semibold">Admin</span></p><button className="lg:hidden btn !min-h-[40px] bg-white/10 text-white" onClick=${()=>setAuth(false)}><${I} n="out" s=${16}/>Sign out</button></div><nav aria-label="Admin" className="flex lg:block gap-1 px-2 pb-2 overflow-x-auto">${nav.map(n=>html`<button key=${n[0]} aria-current=${pg===n[0]?'page':undefined} onClick=${()=>setPg(n[0])} className=${'flex items-center gap-2 px-3 min-h-[44px] rounded-lg font-semibold whitespace-nowrap w-full lg:mb-1 '+(pg===n[0]?'bg-[#F7B52C] text-black':'text-stone-300 hover:bg-white/10')}><${I} n=${n[1]} s=${18}/>${n[0]}</button>`)}</nav><div className="hidden lg:block absolute bottom-4 left-2 right-2"><button className="flex items-center gap-2 px-3 min-h-[44px] text-stone-300 hover:text-white" onClick=${()=>setAuth(false)}><${I} n="out" s=${18}/>Sign out</button></div></aside>
<main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-5xl w-full"><p className="text-xs bg-amber-50 border border-amber-300 text-amber-900 rounded-lg p-2 mb-4">Prototype. Changes are saved only in this browser. The real admin would save to a database that the public website reads.</p>${body}</main>
<div role="status" aria-live="polite" className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60]">${msg&&html`<div className="bg-[#111] text-white px-4 py-2 rounded-xl shadow-lg text-sm flex items-center gap-2"><${I} n="check" s=${16}/>${msg}</div>`}</div></div>`};
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
