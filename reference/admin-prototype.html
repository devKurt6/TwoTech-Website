<style>
:root{--navy:#111111;--blue:#F7B52C;--bg:#faf8f3;--ink:#0f1b33;--mut:#4d5a73}
html{scroll-behavior:smooth;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
:focus-visible{outline:3px solid #c98a00;outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:.6rem 1.2rem;border-radius:.75rem;font-weight:700;transition:.2s}
.bp{background:#F7B52C;color:#111}.bp:hover{background:#e6a312}
.bs{background:#fff;color:var(--navy);border:1px solid #d9d3c3}.bs:hover{border-color:#F7B52C;color:#8a5a00}
.bd{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3)}.bd:hover{background:rgba(255,255,255,.2)}

.in{width:100%;min-height:44px;padding:.55rem .8rem;border:1px solid #b9c6de;border-radius:.65rem;background:#fff}
.hero{background:radial-gradient(90% 120% at 90% 0,#F7B52C44,transparent 60%),linear-gradient(160deg,#111111,#241c07)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<body><div id="root"></div>
<script>

const P=n=>'₱'+n.toLocaleString('en-PH');

['Ryzen 5 5600 (6-core)','Processors',7490,12,'AM4 · 6 cores / 12 threads · 3.5–4.4 GHz · 65W'],
['Core i5-12400F','Processors',8250,5,'LGA1700 · 6 cores / 12 threads · up to 4.4 GHz · No iGPU'],

['1TB 7200RPM HDD','SSD & HDD',2450,14,'3.5" SATA · 7200 RPM · 64MB cache'],
['RTX 4060 8GB','Graphics Cards',18900,4,'8GB GDDR6 · 115W · 1× 8-pin power'],
['RX 6600 8GB','Graphics Cards',12900,0,'8GB GDDR6 · 132W · 1× 8-pin power'],

{id:'auto',t:'Automation & AI',ic:'bot',mode:'quote',from:'Quote-based',d:'Remove repetitive work and add smart features.',items:['Excel/VBA automation','Workflow automation','Chatbot development','Image processing & object detection']},
{id:'emb',t:'Embedded Systems & IoT',ic:'chip',mode:'quote',from:'Quote-based',d:'Hardware and firmware prototypes that sense and respond.',items:['Arduino & ESP32 programming','Sensor integration','Monitoring systems','Smart device prototypes','Custom embedded projects']},
{id:'setup',t:'Computer Setup & Upgrades',ic:'pc',mode:'book',from:'From ₱500*',d:'Build it right or upgrade what you have.',items:['Custom PC assembly','Parts compatibility assessment','RAM & SSD upgrades','GPU installation','Operating system & driver setup'],modes:['Drop-off','Onsite']},

{id:'net',t:'Network & IT Support',ic:'wifi',mode:'book',from:'From ₱500*',d:'Stable Wi-Fi, shared files, and printers that print.',items:['Router & Wi-Fi setup','LAN troubleshooting','Printer setup','File sharing setup','Remote & onsite technical support'],modes:['Onsite','Remote']}];

const NAV=['Home','Shop','Services','Custom Projects','About','Contact'];
const ref=p=>p+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
/* ---------- Shared UI ---------- */
const Demo=({children})=>html`<div className="flex gap-2 items-start rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-sm p-3"><${I} n="info" s=${18} c="mt-0.5 shrink-0"/><span>${children}</span></div>`;
const Pic=({p,big})=>{const [bad,setBad]=useState(false);
 const src='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1a1a"/><stop offset="1" stop-color="#F7B52C"/></linearGradient></defs><rect width="400" height="300" fill="url(#g)"/><g fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="6"><rect x="130" y="80" width="140" height="140" rx="18"/><rect x="165" y="115" width="70" height="70" rx="8"/></g></svg>`);
 return bad?html`<div className="grid place-items-center bg-slate-200 text-slate-500 aspect-[4/3]"><${I} n=${CI[p.cat]} s=${40}/></div>`:html`<div className="relative aspect-[4/3] overflow-hidden bg-slate-800"><img src=${src} alt="" onError=${()=>setBad(true)} className="w-full h-full object-cover"/><div className="absolute inset-0 grid place-items-center text-white"><${I} n=${CI[p.cat]} s=${big?72:48}/></div></div>`};
const Field=({l,err,children,help})=>html`<label className="block text-sm font-semibold">${l}${children}${help&&html`<span className="block text-xs font-normal text-slate-600 mt-1">${help}</span>`}${err&&html`<span role="alert" className="block text-sm text-red-700 mt-1">${err}</span>`}</label>`;
const Modal=({title,onClose,children})=>{const r=useRef();useEffect(()=>{const k=e=>e.key==='Escape'&&onClose();document.addEventListener('keydown',k);r.current&&r.current.focus();return()=>document.removeEventListener('keydown',k)},[]);
 return html`<div className="fixed inset-0 z-50 bg-[#000000cc] flex items-end sm:items-center justify-center p-0 sm:p-4" onClick=${onClose}><div role="dialog" aria-modal="true" aria-label=${title} tabIndex="-1" ref=${r} onClick=${e=>e.stopPropagation()} className="bg-white w-full sm:max-w-3xl max-h-[92vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl"><div className="sticky top-0 bg-white flex justify-between items-center px-5 py-3 border-b z-10"><h2 className="font-extrabold text-lg">${title}</h2><button className="p-2 rounded-lg hover:bg-slate-100" aria-label="Close dialog" onClick=${onClose}><${I} n="x"/></button></div><div className="p-5">${children}</div></div></div>`};
const Done=({title,refNo,children,onReset,go})=>html`<div className="card p-6 sm:p-8 text-center max-w-xl mx-auto"><div className="mx-auto w-14 h-14 rounded-full bg-emerald-100 text-emerald-700 grid place-items-center mb-3"><${I} n="check" s=${28}/></div><h2 className="text-2xl font-extrabold">${title}</h2><p className="mt-2 text-sm font-bold text-amber-800 bg-amber-50 rounded-lg p-2">DEMO ONLY — this is not a real order, booking, or inquiry.</p><p className="mt-4 text-slate-600">Demo reference</p><p className="text-2xl font-extrabold text-[#8a5a00] tracking-wide">${refNo}</p><div className="mt-3 text-left text-slate-700 space-y-2">${children}</div><div className="mt-5 flex gap-2 justify-center flex-wrap"><button className="btn bs" onClick=${onReset}>Submit another</button><button className="btn bp" onClick=${()=>go('Home')}>Back to home</button></div></div>`;
const Head=({t,s})=>html`<div className="mb-6"><h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight">${t}</h1>${s&&html`<p className="mt-2 text-slate-600 max-w-2xl">${s}</p>`}</div>`;
/* ---------- Header / Footer ---------- */
const Header=({page,go,count,openCart})=>{const [o,setO]=useState(false);useEffect(()=>{const k=e=>e.key==='Escape'&&setO(false);document.addEventListener('keydown',k);return()=>document.removeEventListener('keydown',k)},[]);
 const L=n=>html`<button key=${n} aria-current=${page===n?'page':undefined} onClick=${()=>{go(n);setO(false)}} className=${'px-3 min-h-[44px] rounded-lg font-semibold text-sm transition '+(page===n?'bg-white/15 text-white':'text-stone-300 hover:text-white hover:bg-white/10')}>${n}</button>`;
 return html`<header className="sticky top-0 z-40 bg-[#111111] text-white shadow-lg"><div className="max-w-6xl mx-auto px-4 flex items-center justify-between h-16"><button onClick=${()=>go('Home')} className="flex items-center gap-2 font-extrabold text-lg"><span className="w-9 h-9 rounded-lg bg-[#F7B52C] text-black grid place-items-center"><${I} n="chip" s=${20}/></span>Two<span className="text-[#F7B52C]">Tech</span><span className="text-stone-300 font-semibold hidden md:inline text-xs leading-tight max-w-[9rem] text-left">Computer Engrs' Repair Services</span></button>
 <nav className="hidden lg:flex" aria-label="Main">${NAV.map(L)}</nav>
 <div className="flex items-center gap-1"><button className="relative p-3 rounded-lg hover:bg-white/10" aria-label=${'Cart, '+count+' items'} onClick=${openCart}><${I} n="cart" s=${24}/>${count>0&&html`<span className="absolute top-1 right-0 bg-[#F7B52C] text-black text-xs font-bold rounded-full min-w-[20px] h-5 grid place-items-center px-1">${count}</span>`}</button><button className="lg:hidden relative w-11 h-11 rounded-lg hover:bg-white/10" aria-expanded=${o} aria-label=${o?'Close menu':'Open menu'} onClick=${()=>setO(!o)}>${['translateY(-7px)','scaleX(1)','translateY(7px)'].map((t,i)=>html`<span key=${i} aria-hidden="true" className="absolute left-1/2 top-1/2 -ml-[11px] -mt-px block w-[22px] h-0.5 rounded bg-white" style=${{transition:'transform .3s ease, opacity .2s ease',opacity:o&&i===1?0:1,transform:o?(i===0?'rotate(45deg)':i===2?'rotate(-45deg)':'scaleX(0)'):t}}/>`)}</button></div></div>
 ${o&&html`<div className="lg:hidden fixed inset-0 -z-10" onClick=${()=>setO(false)}></div>`}<nav aria-label="Mobile" className=${'lg:hidden absolute right-3 top-full mt-2 w-56 max-w-[calc(100vw-1.5rem)] rounded-2xl bg-[#111111] border border-white/15 shadow-2xl p-2 grid origin-top-right '+(o?'visible':'invisible')} style=${{transition:'opacity .22s ease, transform .22s ease, visibility .22s',opacity:o?1:0,transform:o?'none':'translateY(-8px) scale(.95)'}}>${NAV.map((n,i)=>html`<button key=${n} aria-current=${page===n?'page':undefined} onClick=${()=>{go(n);setO(false)}} className=${'text-left px-3 min-h-[44px] rounded-lg font-semibold text-sm '+(page===n?'bg-[#F7B52C] text-black':'text-stone-200 hover:bg-white/10')} style=${{transition:'opacity .25s ease, transform .25s ease, background-color .2s',transitionDelay:o?(60+i*45)+'ms':'0ms',opacity:o?1:0,transform:o?'none':'translateX(10px)'}}>${n}</button>`)}</nav></header>`};
const Footer=({go})=>html`<footer className="bg-[#111111] text-stone-300 mt-16"><div className="max-w-6xl mx-auto px-4 py-10 grid gap-8 sm:grid-cols-2 lg:grid-cols-4 text-sm"><div><p className="text-white font-extrabold text-lg">Two Tech</p><p className="mt-2">Computer Engrs' Repair Services. Computer parts, repairs, and custom development.</p></div><div><p className="text-white font-bold mb-2">Explore</p><div className="grid">${NAV.map(n=>html`<button key=${n} className="text-left py-1.5 hover:text-white" onClick=${()=>{go(n);scrollTo(0,0)}}>${n}</button>`)}</div></div><div><p className="text-white font-bold mb-2">Contact</p><p>Phone: +63 963 310 2486</p><p>Email: twotech0128@gmail.com</p><p><a className="underline hover:text-white" href="https://www.facebook.com/Engr.TwoTECH" target="_blank" rel="noopener noreferrer">Facebook: Engr.TwoTECH</a></p></div><div><p className="text-white font-bold mb-2">Hours & area</p><p>9:00 AM–8:00 PM</p><p className="mt-2">Purok 4, Brgy. Sta. Maria, Filinvest Rd, Santo Tomas. Nearby areas subject to availability.</p></div></div><p className="text-center text-xs pb-6 px-4">Prototype with demo data. Prices, stock, and confirmations are not real.</p></footer>`;
/* ---------- Home ---------- */
const Home=({go,add,view,goSvc})=>html`<div>
<section className="hero text-white"><div className="max-w-6xl mx-auto px-4 py-16 sm:py-24 grid lg:grid-cols-5 gap-10 items-center"><div className="lg:col-span-3"><h1 className="text-4xl sm:text-5xl font-extrabold leading-tight tracking-tight">Your Partner in IT Solutions, Repairs & Custom Development.</h1><p className="mt-5 text-stone-300 text-lg max-w-xl">From choosing the right computer parts to fixing a PC that won't boot, to building software and embedded devices for your business — one local team, clear quotations.</p><div className="mt-8 flex flex-wrap gap-3"><button className="btn bp" onClick=${()=>goSvc('repair')}>Explore Services</button><button className="btn bd" onClick=${()=>go('Shop')}>Shop Computer Parts</button></div></div>
<div className="lg:col-span-2 grid gap-3">${[['Buy parts','Shop','cart','Processors, RAM, storage, GPUs and more.'],['Book a repair','Services','wrench','Diagnosis, cleaning, formatting, upgrades.'],['Request a quote','Custom Projects','code','Software, automation, embedded systems.']].map(a=>html`<button key=${a[0]} onClick=${()=>a[1]==='Services'?goSvc('repair'):go(a[1])} className="text-left flex gap-3 items-center rounded-2xl bg-white/10 border border-white/20 p-4 hover:bg-white/20 transition"><span className="w-11 h-11 rounded-xl bg-[#F7B52C] text-black grid place-items-center shrink-0"><${I} n=${a[2]}/></span><span><b className="block">${a[0]}</b><span className="text-sm text-stone-300">${a[3]}</span></span></button>`)}</div></div></section>
<section className="max-w-6xl mx-auto px-4 mt-14"><h2 className="text-2xl sm:text-3xl font-extrabold mb-5">What we do</h2><div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${SVC.map(s=>html`<button key=${s.id} onClick=${()=>goSvc(s.mode==='book'?'repair':'dev')} className="card h p-5 text-left"><span className="w-11 h-11 rounded-xl bg-amber-50 text-[#8a5a00] grid place-items-center"><${I} n=${s.ic}/></span><b className="block mt-3">${s.t}</b><span className="text-sm text-slate-600">${s.items.length} services</span></button>`)}</div></section>
<section className="max-w-6xl mx-auto px-4 mt-14"><div className="flex justify-between items-end mb-5"><h2 className="text-2xl sm:text-3xl font-extrabold">Featured computer parts</h2><button className="font-bold text-[#8a5a00] min-h-[44px]" onClick=${()=>go('Shop')}>View all</button></div><div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${[1,5,7,9].map(i=>html`<${PCard} key=${i} p=${PRODUCTS[i-1]} add=${add} view=${view}/>`)}</div><p className="text-xs text-slate-600 mt-3">Demo prices and inventory.</p></section>
<section className="max-w-6xl mx-auto px-4 mt-14"><h2 className="text-2xl sm:text-3xl font-extrabold mb-5">How it works</h2><div className="grid md:grid-cols-3 gap-4">${[['Buying parts','Browse the shop, add items to your cart, and choose delivery or pickup.'],['Booking a service','Pick a service, describe the problem, and request a schedule. We confirm the slot with you.'],['Requesting a quotation','Tell us what you need built. We review the scope first, then send a quotation.']].map((s,i)=>html`<div key=${i} className="card p-5"><span className="font-extrabold text-[#8a5a00]">Step ${i+1}</span><b className="block mt-1 text-lg">${s[0]}</b><p className="text-slate-600 mt-1">${s[1]}</p></div>`)}</div></section>
<section className="max-w-6xl mx-auto px-4 mt-14 grid md:grid-cols-3 gap-4">${[['Clear quotations','You see the scope and price basis before we begin.'],['Careful diagnosis','We inspect first, so you pay to fix the actual problem.'],['Practical solutions','Right-sized fixes and builds, not unnecessary upgrades.']].map(a=>html`<div key=${a[0]} className="p-5 border-l-4 border-[#F7B52C] bg-white rounded-r-xl"><b>${a[0]}</b><p className="text-slate-600 text-sm mt-1">${a[1]}</p></div>`)}</section>
<section className="max-w-6xl mx-auto px-4 mt-14"><div className="hero rounded-3xl text-white p-8 sm:p-12 flex flex-wrap gap-5 items-center justify-between"><div className="max-w-xl"><h2 className="text-2xl sm:text-3xl font-extrabold">Have a custom project in mind?</h2><p className="text-stone-300 mt-2">Websites, automation, AI image processing, or an Arduino/ESP32 device. Send your requirements and we'll review them.</p></div><button className="btn bp" onClick=${()=>go('Custom Projects')}>Request a Quote</button></div></section></div>`;

 <section className="mt-8 grid lg:grid-cols-2 gap-5" id="contact"><div><h2 className="text-2xl font-extrabold">Contact</h2><div className="card p-5 mt-3 grid gap-3 text-sm"><p><b>Phone:</b> +63 963 310 2486</p><p><b>Email:</b> twotech0128@gmail.com</p><p><b>Facebook:</b> <a className="underline text-[#8a5a00] font-semibold" href="https://www.facebook.com/Engr.TwoTECH" target="_blank" rel="noopener noreferrer">facebook.com/Engr.TwoTECH</a></p><p className="flex gap-2"><${I} n="pin" s=${18} c="shrink-0"/><span>Purok 4, Brgy. Sta. Maria, Filinvest Rd, Santo Tomas, Batangas. Nearby areas subject to availability. <a className="underline text-[#8a5a00] font-semibold" href="https://maps.app.goo.gl/KLWRCZbpFzx4qBjE8" target="_blank" rel="noopener noreferrer">Open in Google Maps</a></span></p><p><b>Hours:</b> 9:00 AM–8:00 PM</p></div></div>
 <div><h2 className="text-2xl font-extrabold">Send a message</h2>${sent?html`<div className="card p-5 mt-3"><b>Demo message sent.</b><p className="text-sm text-slate-600 mt-1">Nothing was actually delivered. This form is a prototype.</p><button className="btn bs mt-3" onClick=${()=>{setSent(false);setF({name:'',email:'',msg:''})}}>Write another</button></div>`:html`<form onSubmit=${sub} noValidate className="card p-5 mt-3 grid gap-3"><${Field} l="Name" err=${e.name}><input className="in mt-1" value=${f.name} onInput=${ev=>setF({...f,name:ev.target.value})}/><//><${Field} l="Email" err=${e.email}><input className="in mt-1" type="email" value=${f.email} onInput=${ev=>setF({...f,email:ev.target.value})}/><//><${Field} l="Message" err=${e.msg}><textarea className="in mt-1" rows="4" value=${f.msg} onInput=${ev=>setF({...f,msg:ev.target.value})}/><//><button className="btn bp" type="submit">Send Message</button></form>`}</div></section></div>`};
/* ---------- App ---------- */
const App=()=>{const [page,setPage]=useState('Home');const [pre,setPre]=useState('');const [cart,setCart]=useState(()=>{try{return JSON.parse(localStorage.getItem('kt-cart'))||[]}catch(e){return[]}});const [open,setOpen]=useState(false);const [prod,setProd]=useState(null);const [toast,setToast]=useState('');
 useEffect(()=>{try{localStorage.setItem('kt-cart',JSON.stringify(cart))}catch(e){}},[cart]);
 const items=cart.map(c=>({p:PRODUCTS.find(p=>p.id===c.id),q:c.q})).filter(i=>i.p);const count=items.reduce((a,i)=>a+i.q,0);
 const go=p=>{setPage(p);scrollTo(0,0)};const [svcTab,setSvcTab]=useState('repair');const goSvc=t=>{setSvcTab(t);go('Services')};
 const setQty=(id,q)=>setCart(c=>q<=0?c.filter(i=>i.id!==id):c.map(i=>i.id===id?{...i,q}:i));
 const add=(p,n)=>{setCart(c=>{const x=c.find(i=>i.id===p.id);const q=Math.min(p.stock,(x?x.q:0)+n);return x?c.map(i=>i.id===p.id?{...i,q}:i):[...c,{id:p.id,q}]});setToast(p.name+' added to cart');setTimeout(()=>setToast(''),2000)};
 const book=id=>{setPre(id);go('Book')};
 return html`<div className="min-h-screen flex flex-col"><${Header} page=${page} go=${go} count=${count} openCart=${()=>setOpen(true)}/><main className="flex-1 pb-4">${page==='Home'?html`<${Home} go=${go} add=${add} view=${setProd} goSvc=${goSvc}/>`:page==='Shop'?html`<${Shop} add=${add} view=${setProd}/>`:page==='Services'?html`<${Services} go=${go} book=${book} tab=${svcTab} setTab=${setSvcTab}/>`:page==='Book'?html`<${Booking} pre=${pre} go=${go} key=${pre}/>`:page==='Custom Projects'?html`<${Project} go=${go}/>`:html`<${About} go=${go}/>`}</main><${Footer} go=${go}/>
 ${open&&html`<${Cart} items=${items} setQty=${setQty} onClose=${()=>setOpen(false)} go=${go}/>`}${prod&&html`<${Detail} p=${prod} add=${add} onClose=${()=>setProd(null)}/>`}
 <div role="status" aria-live="polite" className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60]">${toast&&html`<div className="bg-[#111111] text-white px-4 py-2 rounded-xl shadow-lg text-sm">${toast}</div>`}</div></div>`};
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
